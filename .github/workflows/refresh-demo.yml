name: refresh-demo-data

# Re-seeds the public "demo-seed" project in the production database, so the
# live demo never ages out of the 30-day scoring window.
# Runs on a GitHub runner (a US datacenter, close to Neon) rather than your laptop,
# where every database round trip is slow.

on:
  schedule:
    - cron: "17 5 * * *" # daily; an odd minute avoids the busy top-of-the-hour queue
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: refresh-demo-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Without DATABASE_URL, Django silently falls back to a throwaway SQLite file on the
      # runner: the job would "succeed" while the real demo kept going stale. Fail loudly.
      - name: Refuse to run without the production database secret
        env:
          NEON: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON" ]; then
            echo "NEON_DATABASE_URL secret is not set." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Re-seed demo-seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python manage.py seed_demo --reset